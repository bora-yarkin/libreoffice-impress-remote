[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impress-remote-companion"
dynamic = ["version"]
description = "Cross-platform companion shell for LibreOffice Impress Remote"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
impress-remote-companion = "impress_remote_companion.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impress_remote_companion = ["web/*.html", "web/*.js", "web/*.css", "web/localizations/*.json"]

[tool.setuptools.dynamic]
version = {attr = "impress_remote_companion.__version__"}
